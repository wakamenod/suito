name: suito_web
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1
environment:
  sdk: '>=3.0.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: 2.3.6
  go_router: 7.1.1
  equatable: 2.0.5
  supabase_flutter: ^2.3.0
  envied: ^0.3.0+3
  slang: ^3.18.1
  slang_flutter: ^3.18.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  envied_generator: ^0.3.0+3
  mocktail: ^0.3.0
  # transitive via supabase_flutter; imported directly by the tests to install
  # the in-memory mock store that backs session persistence.
  shared_preferences: ^2.2.0

dependency_overrides:
  # watcher 1.0.x's _ConstructableFileSystemEvent breaks under Dart 3's sealed
  # dart:io classes; 1.1.0+ fixes it. Needed for the slang code generator.
  watcher: 1.1.0
flutter:
  uses-material-design: true
