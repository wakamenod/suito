version: '3'
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/html:/var/www/html
      - /etc/lego:/etc/lego
      - ./web/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web/build/web:/var/www/web
