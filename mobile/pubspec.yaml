name: suito
description: A new Flutter project.

publish_to: "none"

version: 1.0.2+11

environment:
  # sdk: ">=2.19.6 <3.0.0"
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.3.0
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.3.6
  go_router: ^9.1.1
  riverpod_annotation: ^2.1.1
  envied: ^0.3.0+3
  rxdart: ^0.27.7
  freezed_annotation: ^2.2.0
  json_annotation: ^4.8.1
  dropdown_button2: ^2.1.3
  formz: ^0.6.0
  intl: ^0.18.0
  slang: ^3.18.1
  slang_flutter: ^3.18.0
  flutter_launcher_icons: ^0.13.1
  syncfusion_flutter_charts: ^21.2.10
  package_info_plus: ^4.0.2
  url_launcher: ^6.1.11
  flutter_timezone: ^1.0.6
  flutter_toggle_tab: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^0.3.0
  # transitive via supabase_flutter; imported directly by the auth tests to
  # install the in-memory mock store that backs session persistence.
  shared_preferences: ^2.2.0
  custom_lint: 0.3.4
  riverpod_lint: 1.3.0
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  riverpod_generator: ^2.2.2
  envied_generator: ^0.3.0+3
  freezed: ^2.3.3
  json_serializable: ^6.6.2
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/NotoSerifJP-Light.otf
          weight: 300
        - asset: assets/fonts/NotoSerifJP-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSerifJP-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSerifJP-SemiBold.otf
          weight: 600
        - asset: assets/fonts/NotoSerifJP-Bold.otf
          weight: 700
        - asset: assets/fonts/NotoSerifJP-Black.otf
          weight: 900

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon_ios.png"
  adaptive_icon_foreground: "assets/icon_android.png"
  adaptive_icon_background: "#46B4EB"

dependency_overrides:
  # watcher 1.0.x's _ConstructableFileSystemEvent breaks under Dart 3's sealed
  # dart:io classes; 1.1.0+ fixes it. Needed for the slang code generator.
  watcher: 1.1.0
