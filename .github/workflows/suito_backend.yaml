name: Suito Backend CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "${{ secrets.DB_PASS }}"
        ports:
          - 3346:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
        volumes:
          - mysqlconf.d:/etc/mysql/conf.d
    #   redis:
    #     image: redis
    #     ports:
    #       - 6399:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up cargo-make
        uses: davidB/rust-cargo-make@v1
        with:
          version: "0.37.24"

      - name: Create env files
        run: |
          echo "${{ secrets.ENV }}" > ./.env.suito

      - name: Build
        run: |
          cd backend && cargo make build

      - name: Init DB
        run: |
          mysql -h 127.0.0.1 --port 3346 -u root -p"${{ secrets.DB_PASS }}" < ddl/init.sql
          cargo make install
          cargo make migrate-up

      - name: Test
        run: |
          cd backend
          cargo make install
          cargo make test-github
