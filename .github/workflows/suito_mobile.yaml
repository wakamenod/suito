name: Suito Mobile CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "mobile/**"
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # envied reads .env.mobile and generates lib/env/env.g.dart (gitignored),
      # so the keys are written here and the file is generated below.
      - name: Create configuration files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
        run: |
          cat > mobile/.env.mobile <<EOF
          BACKEND_BASE_URL=${BACKEND_BASE_URL}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

      - name: Set up Java
        uses: actions/setup-java@v1
        with:
          java-version: "12.x"

      - name: Setup homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: install fvm
        run: |
          brew tap leoafarias/fvm
          brew install fvm

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Set up cargo-make
        uses: davidB/rust-cargo-make@v1
        with:
          version: "0.35.0"

      - name: setup flutter
        run: cd mobile && cargo make fvm-install

      - name: Flutter pub get
        run: cd mobile && cargo make install

      - name: Code generation (envied / riverpod / freezed)
        run: cd mobile && cargo make freeze

      - name: Lint
        run: cd mobile && cargo make lint

      # `supabase`-tagged tests need a local Supabase stack; excluded here.
      - name: Test
        run: cd mobile && cargo make ci-test
