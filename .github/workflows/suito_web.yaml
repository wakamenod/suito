name: Suito Web CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "web/**"
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # envied reads .env.mobile and generates lib/env/env.g.dart (gitignored),
      # so the keys are written here and the file is generated below.
      - name: Create configuration files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > web/.env.mobile <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

      - name: Setup homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: install fvm
        run: |
          brew tap leoafarias/fvm
          brew install fvm

      - name: install just
        run: brew install just

      - name: setup flutter
        run: cd web && just fvm-install

      - name: Flutter pub get
        run: cd web && just install

      - name: Code generation (envied)
        run: cd web && just build_runner

      - name: Lint
        run: cd web && just lint

      - name: Test
        run: cd web && just test
